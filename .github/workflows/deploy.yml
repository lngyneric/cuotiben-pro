name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Setup wrangler config
        run: |
          # 从模板生成 wrangler.jsonc（gitignored）
          cp wrangler.example.jsonc wrangler.jsonc
          # D1 数据库已手动创建，直接用 ID（避免 API token 权限问题）
          DB_ID="3683252e-d123-4a30-a092-322058f5b84f"
          echo "D1 database_id: $DB_ID"
          sed -i "s/REPLACE_WITH_OUTPUT_OF_WRANGLER_D1_CREATE/$DB_ID/" wrangler.jsonc
          sed -i 's/"database_name": "shipany-db"/"database_name": "cuotiben-pro-db"/' wrangler.jsonc
          sed -i 's/"name": "shipany-tanstack"/"name": "cuotiben-pro"/' wrangler.jsonc
          sed -i "s|https://<worker>.<your-subdomain>.workers.dev|https://cuotiben-pro.lng-yn.workers.dev|" wrangler.jsonc
          # R2 bucket for HTML uploads
          sed -i 's|// "r2_buckets":     \[{ "binding": "BUCKET", "bucket_name": "..." }\]|"r2_buckets": [{ "binding": "HTML_BUCKET", "bucket_name": "cuotiben-html" }]|' wrangler.jsonc
          # Workers AI binding for cuotiben QA grading and similar problem generation
          sed -i 's|// "ai":               { "binding": "AI" }|"ai": { "binding": "AI" }|' wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate and run D1 migrations
        continue-on-error: true
        run: |
          pnpm db:generate || true
          npx wrangler d1 migrations apply cuotiben-pro-db --remote || echo "D1 migration skipped (permission issue)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_PROVIDER: d1

      - name: Build for Cloudflare
        run: |
          if [ -z "$AUTH_SECRET" ]; then echo "ERROR: AUTH_SECRET secret not set"; exit 1; fi
          NITRO_PRESET=cloudflare_module pnpm build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_APP_URL: https://cuotiben-pro.lng-yn.workers.dev
          VITE_APP_NAME: 错题本 Pro
          DATABASE_PROVIDER: d1
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Set Worker secrets
        run: |
          echo "${{ secrets.AUTH_SECRET }}" | npx wrangler secret put AUTH_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
