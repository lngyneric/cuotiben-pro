name: Fix Admin Password

on:
  workflow_dispatch:
    inputs:
      hash_b64:
        description: 'Base64-encoded password hash'
        required: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g wrangler
      - name: Update password
        run: |
          HASH=$(echo "${{ inputs.hash_b64 }}" | base64 -d)
          # 转义单引号
          HASH_ESCAPED=$(echo "$HASH" | sed "s/'/''/g")
          echo "UPDATE account SET password = '${HASH_ESCAPED}' WHERE provider_id = 'credential';" > /tmp/fix.sql
          npx wrangler d1 execute cuotiben-pro-db --remote --file /tmp/fix.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
